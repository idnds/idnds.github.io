summaryMd: |
  Neuer ELO ECM Suite Release Candidate verfügbar: v25-0.7-rc (25.00.002)

  Mit diesem Update wird die neue LTS-Version 25.00.002 berücksichtigt, die wichtige technologische Weiterentwicklungen enthält.
  Dadurch ergeben sich grundlegende Änderungen in der Plattformarchitektur, die eine vollständige Kompatibilität mit der vorherigen LTS-Version nicht mehr in allen Bereichen gewährleisten.

  Das Update stellt sicher, dass aktuelle Systemstände korrekt erkannt und gesteuert werden und verhindert gleichzeitig ungewollte automatische Versionswechsel.
detailsMd: |
  Die neue LTS-Version 25.00.002 bringt umfangreiche technische Weiterentwicklungen mit sich.
  Diese Änderungen betreffen zentrale Systemkomponenten und führen dazu, dass nicht alle Module vollständig kompatibel mit vorherigen Versionen bleiben.
  Besonders betroffen sind weiterentwickelte Kernbereiche wie Formularverarbeitung, Prozessautomatisierung und administrative Komponenten.

  ### Betroffene Hauptkomponenten

  Im Rahmen der Weiterentwicklung wurden insbesondere folgende Funktionsbereiche technisch angepasst:

  - Formular- und Erfassungsfunktionen
  - Automatisierungs- und Workflow-Prozesse
  - Verwaltungs- und Administrationsoberflächen
  - Integrationskomponenten für KI-gestützte Funktionen
  - Kommunikations- und Kollaborationsschnittstellen (z. B. externe Plattformanbindungen)

  ### Update- und Versionssteuerung

  Das Version-Mapping wurde angepasst, um eine klare Zuordnung aktueller Systemstände zu gewährleisten.
  Automatische Updates auf eine neue „Latest“-Kennzeichnung wurden bewusst deaktiviert, um unbeabsichtigte Systemwechsel zu vermeiden.
  Updates auf die neue Version müssen gezielt und explizit angestoßen werden.

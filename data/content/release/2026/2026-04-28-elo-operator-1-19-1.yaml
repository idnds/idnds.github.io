title: ELO Cloud Kubernetes Operator 1.19.1
publishedAt: "2026-04-28T06:00:00.000Z"
summaryMd: !!str >
  Neues Version-Mapping der ELO ECM Suite verfügbar: v25-0.2.2 (25.00.002)
detailsMd: !!str >
  Die Version hat den Status des "Release Candidate" verlassen und ist nun als
  reguläre LTS-Version verfügbar.


  Sie enthält umfangreiche technologische Weiterentwicklungen, wodurch keine
  vollständige Kompatibilität zur vorherigen LTS-Version 25.00.001 mehr
  gewährleistet werden kann.


  Mögliche Auswirkungen auf bestehende Installationen sollten vor der
  Aktualisierung sorgfältig geprüft werden. Es wird empfohlen, die neuen
  Funktionen und Änderungen in einer Testumgebung zu evaluieren, bevor sie in
  Produktionsumgebungen eingesetzt werden.

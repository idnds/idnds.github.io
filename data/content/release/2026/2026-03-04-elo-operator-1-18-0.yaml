summaryMd: |
  Neue ELO ECM Suite LTS-Versionen verfügbar: v23-0.27 und v25-0.6

  Des weiteren werden mit diesem Update die Stabilität und Performance der Plattform verbessert.
  Ziel ist eine zuverlässigere Startphase der Dienste, eine bessere Ressourcennutzung und eine optimierte Verarbeitung im Hintergrundbetrieb.
  Zusätzlich wird die Verwaltung von Prioritäten für Systemprozesse eingeführt, um kritische Komponenten besser steuern zu können.
detailsMd: |
  Die wichtigsten Änderungen lassen sich in die folgenden Bereiche unterteilen:

  ### Stabilität und Startverhalten

  Der Startprozess wurde angepasst, sodass zentrale Systemdienste jetzt gezielter geprüft werden. Dadurch wird sichergestellt, dass abhängige Komponenten erst dann starten, wenn die Kernservices vollständig verfügbar sind.
  Eine Fehlkonfiguration von Systemvariablen, die in bestimmten Fällen zu unerwartetem Verhalten führen konnte, wurde korrigiert.

  ### Performance- und Effizienzverbesserungen

  Die Verarbeitung großer Datenmengen wurde optimiert, indem unnötige Vergleichs- und Differenzberechnungen reduziert werden.
  Zusätzlich wurde die interne Analyse des Verarbeitungsprozesses verbessert, um mögliche Engpässe schneller erkennen zu können.

  ### Ressourcen- und Prioritätssteuerung

  Es ist nun möglich, die Priorität von Systemdiensten festzulegen. Dadurch können wichtige Prozesse im Betrieb bevorzugt behandelt werden.
  Diese Steuerung betrifft sowohl die zentrale Steuerungseinheit als auch die angebundenen Services.

  ### Plattform- und Versionsunterstützung

  Die Plattform wurde um Unterstützung für aktuelle ELO-Systemstände erweitert.
  Damit werden sowohl neuere als auch bestehende Installationen besser unterstützt und können einheitlicher betrieben werden.

summaryMd: |
  Wartung zur Behebung kritischer Sicherheitslücken (CVE-2026-3517, CVE-2026-3518, CVE-2026-3519, CVE-2026-4048, CVE-2026-21876) in Kemp LoadMaster. Das System ist während der Arbeiten kurzzeitig nicht verfügbar.
detailsMd: |
  Es wird eine Wartung durchgeführt, um die neuesten Sicherheitsupdates für Kemp LoadMaster einzuspielen. Betroffen sind GA-Versionen bis v7.2.62.2 und LTSF-Versionen bis v7.2.54.16.  
  Durch die Hochverfügbarkeit ist während dieses Zeitraums nicht mit Einschränkungen zu rechnen.

  **Ziel der Wartung ist die Behebung der kritischen CVEs:**
  - CVE-2026-3517: Command Injection Remote Code Execution
  - CVE-2026-3518: Command Injection Remote Code Execution
  - CVE-2026-3519: Authenticated API OS Command Injection
  - CVE-2026-4048: Command Injection Remote Code Execution
  - CVE-2026-21876: Multipart WAF Bypass

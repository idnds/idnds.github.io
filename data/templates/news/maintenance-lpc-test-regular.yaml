_meta:
  name: "lpc-test - Regelwartung"
  description: "Quarteilsweise Wartung der Testumgebung"

typeId: maintenance
productIds:
  - lpc-test
title: "Regelwartung - Lieblingsplatz.cloud (Test)"
impact:
  - limited-availability
  - action-required
summaryMd: |
  Die Lieblingsplatz.cloud-Testumgebung wird routinemäßig quartalsweise gewartet. 
  Wartungen finden jeweils am dritten Donnerstag der Monate Januar, April, Juli und Oktober ab 18 Uhr statt.
detailsMd: |
  Die Wartung der Testumgebung umfasst die folgenden Arbeiten:
  - ELO Operator-Update auf den aktuellen Stand
  - ELO ECM Suite-Update auf LTS-Version
  - Plattform-Updates
  - ELO XC Updates
customerActionMd: |
  Bitte prüfen Sie nach dem Update die Funktionalität Ihrer Anwendungen und Prozesse in der Testumgebung.

  Melden Sie uns eventuelle Fehler oder Auffälligkeiten **spätestens bis eine Woche vor dem geplanten Update der Produktivumgebung**, damit diese rechtzeitig analysiert und behoben werden können.

  Erfolgt keine Rückmeldung, gehen wir davon aus, dass keine Einschränkungen vorliegen und das Produktivupdate wie geplant durchgeführt werden kann.

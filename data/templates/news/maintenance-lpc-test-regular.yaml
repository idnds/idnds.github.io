title: "Regelwartung - Lieblingsplatz.cloud (Test)"
impact:
  - limited-availability
summaryMd: |
  Die Lieblingsplatz.cloud-Testumgebung wird routinemäßig quartalsweise gewartet. 
  Wartungen finden jeweils am dritten Donnerstag der Monate Januar, April, Juli und Oktober ab 18 Uhr statt.
detailsMd: |
  Die Wartung der Testumgebung umfasst die folgenden Arbeiten:
  - Operator-Update auf den aktuellen Stand
  - Auto-Update der Umgebungen mit Versionierung v2X-X-latest
  - Plattform-Updates
  - ELO XC Updates
title: "Regelwartung - Lieblingsplatz.cloud (Produktiv)"
impact:
  - limited-availability
summaryMd: |
  Die Lieblingsplatz.cloud-Produktivumgebung wird routinemäßig quartalsweise gewartet. 
  Wartungen finden jeweils am dritten Donnerstag der Monate Februar, Mai, August und November ab 18 Uhr statt.
detailsMd: |
  Die Wartung der Produktivumgebung umfasst die folgenden Arbeiten:
  - Plattform-Updates
  - ELO Operator-Update auf den Stand der Testumgebung
  - ELO ECM Suite-Update auf LTS-Version der Testumgebung
  - ELO XC Updates auf den Stand der Testumgebung
